<title>Krypton</title>
<style>
:root{
  --vh:100dvh;--kb:0px;
  --bg:#ffffff;--bg2:#f7f7f8;--surface:#ffffff;--fg:#0d0d0d;--fg2:#5d5d5d;--mute:#8e8e93;
  --line:rgba(0,0,0,.08);--card:#f4f4f4;--user-bg:#f4f4f4;--user-fg:#0d0d0d;
  --black:#0d0d0d;--black-fg:#ffffff;--blue:#007aff;--blue-bg:#eaf3ff;--amber:#f59e0b;
  --bad:#d93025;--bad-bg:#fff1f0;--bad-line:#ffccc7;--ok:#16a34a;
  --glass:rgba(255,255,255,.78);--glass-strong:rgba(252,252,254,.92);--glass-line:rgba(255,255,255,.75);--glass-border:rgba(0,0,0,.09);
  --shadow:0 8px 30px rgba(0,0,0,.09);--shadow-sm:0 2px 12px rgba(0,0,0,.06);
  --code-bg:#f7f7f8;--track:#ececee;--dot:rgba(0,0,0,.2);--dot-on:rgba(255,255,255,.32)
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0d0d0d;--bg2:#171717;--surface:#1c1c1e;--fg:#f5f5f5;--fg2:#b4b4b4;--mute:#8e8e93;
  --line:rgba(255,255,255,.1);--card:#212121;--user-bg:#2a2a2d;--user-fg:#f5f5f5;
  --black:#f5f5f5;--black-fg:#0d0d0d;--blue:#4da3ff;--blue-bg:#162944;--amber:#fbbf24;
  --bad:#ff6b6b;--bad-bg:#2c1616;--bad-line:#5c2626;--ok:#4ade80;
  --glass:rgba(30,30,34,.8);--glass-strong:rgba(32,32,36,.94);--glass-line:rgba(255,255,255,.14);--glass-border:rgba(255,255,255,.12);
  --shadow:0 10px 32px rgba(0,0,0,.5);--shadow-sm:0 2px 14px rgba(0,0,0,.38);
  --code-bg:#161618;--track:#2a2a2e;--dot:rgba(255,255,255,.22);--dot-on:rgba(0,0,0,.28)
}}
:root[data-theme=dark]{
  --bg:#0d0d0d;--bg2:#171717;--surface:#1c1c1e;--fg:#f5f5f5;--fg2:#b4b4b4;--mute:#8e8e93;
  --line:rgba(255,255,255,.1);--card:#212121;--user-bg:#2a2a2d;--user-fg:#f5f5f5;
  --black:#f5f5f5;--black-fg:#0d0d0d;--blue:#4da3ff;--blue-bg:#162944;--amber:#fbbf24;
  --bad:#ff6b6b;--bad-bg:#2c1616;--bad-line:#5c2626;--ok:#4ade80;
  --glass:rgba(30,30,34,.8);--glass-strong:rgba(32,32,36,.94);--glass-line:rgba(255,255,255,.14);--glass-border:rgba(255,255,255,.12);
  --shadow:0 10px 32px rgba(0,0,0,.5);--shadow-sm:0 2px 14px rgba(0,0,0,.38);
  --code-bg:#161618;--track:#2a2a2e;--dot:rgba(255,255,255,.22);--dot-on:rgba(0,0,0,.28)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;touch-action:manipulation;overscroll-behavior:none}
body{
  background:var(--bg);color:var(--fg);
  font:15.5px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  position:fixed;top:0;left:0;right:0;width:100%;height:var(--vh);transition:height .12s ease-out;
  display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top)
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,textarea,select{font:inherit;color:inherit}

#app{
  flex:1;min-height:0;display:flex;flex-direction:column;position:relative;
  transition:transform .28s cubic-bezier(.22,1,.36,1),border-radius .28s
}
#app.shifted{transform:scale(.965) translateX(12px);border-radius:24px;overflow:hidden}

/* 顶部液态毛玻璃导航 */
header{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:6px 14px 8px;background:transparent;position:relative;flex:none;z-index:5
}
.g-btn{
  width:42px;height:42px;border-radius:50%;
  background:var(--glass);border:1px solid var(--glass-border);
  box-shadow:var(--shadow-sm),inset 0 1px 0 var(--glass-line);
  backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
  display:inline-flex;align-items:center;justify-content:center;color:var(--fg);flex:none;
  transition:transform .16s cubic-bezier(.22,1,.36,1),opacity .14s
}
.g-btn:active{transform:scale(.9);opacity:.78}
.g-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.seg{
  display:inline-flex;align-items:center;padding:3px;border-radius:22px;
  background:var(--glass);border:1px solid var(--glass-border);
  box-shadow:var(--shadow-sm),inset 0 1px 0 var(--glass-line);
  backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%)
}
.seg button{
  padding:6px 17px;border-radius:18px;font-size:14.5px;font-weight:500;color:var(--fg2);
  transition:background .2s cubic-bezier(.22,1,.36,1),color .2s,transform .12s
}
.seg button:active{transform:scale(.95)}
.seg button.on{background:var(--card);color:var(--fg);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.06)}

.top-right{
  display:inline-flex;align-items:center;height:42px;padding:0 4px;border-radius:21px;
  background:var(--glass);border:1px solid var(--glass-border);
  box-shadow:var(--shadow-sm),inset 0 1px 0 var(--glass-line);
  backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
  flex:none
}
.top-right button{
  width:36px;height:36px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;color:var(--fg);transition:transform .14s,background .14s
}
.top-right button:active{transform:scale(.9);background:var(--card)}
.top-right svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* Forge 工作区常驻文件栏 */
#forgeBar{
  display:none;align-items:center;gap:6px;padding:6px 14px 8px;
  border-bottom:1px solid var(--line);background:var(--bg2);overflow-x:auto;flex:none
}
#forgeBar.on{display:flex}
.fb-tag{font-size:11px;font-weight:700;color:var(--black-fg);background:var(--black);padding:3px 8px;border-radius:8px;flex:none;letter-spacing:.3px}
.fb-file{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;color:var(--fg);flex:none}
.fb-file .fb-sz{color:var(--mute);font-size:11px}
.fb-file .fb-x{color:var(--mute);padding-left:2px;font-size:11px}
.fb-add{display:inline-flex;align-items:center;gap:3px;padding:4px 10px;border-radius:10px;border:1px dashed var(--mute);font-size:12.5px;color:var(--fg2);flex:none}

/* 消息列表 */
#list{flex:1;min-height:0;overflow-y:auto;padding:10px 16px 20px;-webkit-overflow-scrolling:touch}
.empty{
  height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:10px;padding-bottom:6vh;animation:fadeUp .3s cubic-bezier(.22,1,.36,1)
}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.empty h2{margin:0;font-size:24px;font-weight:600;letter-spacing:-.4px;color:var(--fg)}
.empty p{margin:0;font-size:13.5px;color:var(--mute);max-width:280px}
.empty-pills{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:4px;max-width:340px}
.ep{padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--fg2);font-size:13.5px;font-weight:500;box-shadow:var(--shadow-sm)}
.ep:active{transform:scale(.95);background:var(--card)}

#toBot{
  position:absolute;right:16px;bottom:calc(112px + env(safe-area-inset-bottom));z-index:6;
  width:36px;height:36px;border-radius:50%;
  background:var(--glass-strong);border:1px solid var(--glass-border);box-shadow:var(--shadow-sm);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  display:flex;align-items:center;justify-content:center;color:var(--fg);
  opacity:0;pointer-events:none;transform:translateY(8px) scale(.9);
  transition:opacity .2s,transform .2s cubic-bezier(.22,1,.36,1)
}
#toBot.on{opacity:1;pointer-events:auto;transform:none}

.u-wrap{display:flex;justify-content:flex-end;margin:0 0 18px;animation:fadeUp .18s ease-out}
.u{
  max-width:82%;background:var(--user-bg);color:var(--user-fg);
  padding:10px 16px;border-radius:22px;
  white-space:pre-wrap;word-break:break-word;font-size:15.5px;line-height:1.55
}
.u img{display:block;max-width:62vw;max-height:220px;border-radius:14px;margin-bottom:6px}
.fc{display:inline-flex;align-items:center;gap:5px;background:var(--bg);border:1px solid var(--line);padding:4px 10px;border-radius:10px;font-size:13px;color:var(--fg2);margin:0 4px 6px 0}

.a{margin:0 0 22px;max-width:100%}
.th{margin:0 0 8px}
.th-btn{display:inline-flex;align-items:center;gap:6px;color:var(--fg2);padding:4px 0;font-size:14px;font-weight:500}
.th-dot{width:7px;height:7px;border-radius:50%;background:var(--fg);flex:none;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
.th-arr{font-size:12px;color:var(--mute);transition:transform .2s cubic-bezier(.22,1,.36,1)}
.th-btn.open .th-arr{transform:rotate(90deg)}
.tk{
  margin:6px 0 8px;padding:10px 12px;
  background:var(--bg2);border-left:2px solid var(--line);border-radius:0 12px 12px 0;
  color:var(--fg2);font-size:13.5px;line-height:1.6;
  white-space:pre-wrap;word-break:break-word;
  max-height:42vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain
}

.t{word-break:break-word;font-size:15.5px;line-height:1.72;color:var(--fg)}
.t p{margin:0 0 11px}.t p:last-child{margin-bottom:0}
.t h1,.t h2,.t h3,.t h4{margin:16px 0 6px;font-weight:600;line-height:1.35}
.t h1{font-size:19px}.t h2{font-size:17px}.t h3{font-size:16px}
.t ul,.t ol{margin:6px 0 11px;padding-left:20px}.t li{margin:4px 0}
.t blockquote{margin:8px 0;padding:4px 12px;border-left:3px solid var(--line);color:var(--fg2)}
.t code{font:13.5px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--code-bg);padding:1.5px 5px;border-radius:5px}
.tbl-wrap{overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:12px}
.t table{width:100%;border-collapse:collapse;font-size:13.5px}
.t th,.t td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left}
.t th{background:var(--bg2);font-weight:600}
.t tr:last-child td{border-bottom:0}

.file-card{margin:10px 0;border:1px solid var(--line);border-radius:16px;background:var(--bg2);overflow:hidden}
.file-head{display:flex;align-items:center;gap:10px;padding:11px 12px;cursor:pointer}
.file-ico{
  width:38px;height:38px;border-radius:11px;background:var(--surface);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  font-size:9.5px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;color:var(--fg);flex:none
}
.file-info{flex:1;min-width:0}
.file-name{font-size:14px;font-weight:600;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-meta{font-size:12px;color:var(--mute);margin-top:1px}
.file-arr{font-size:12px;color:var(--mute);transition:transform .2s cubic-bezier(.22,1,.36,1);padding:0 4px}
.file-card.open .file-arr{transform:rotate(90deg)}
.file-bar{display:flex;align-items:center;gap:6px;padding:0 12px 11px;flex-wrap:wrap}
.fbtn{padding:5.5px 11px;border-radius:10px;font-size:12.5px;font-weight:500;background:var(--surface);border:1px solid var(--line);color:var(--fg)}
.fbtn.pri{background:var(--black);color:var(--black-fg);border-color:var(--black)}
.fbtn:active{transform:scale(.95);opacity:.8}
.file-src{display:none;border-top:1px solid var(--line);background:var(--code-bg)}
.file-card.open .file-src{display:block}
.file-src pre{margin:0;padding:10px 12px;overflow:auto;font-size:12.5px;line-height:1.55;max-height:44vh;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.file-src pre code{padding:0;background:none;font-size:12.5px}

.typing{display:inline-flex;gap:4px;padding:6px 2px;align-items:center}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--mute);animation:pulse 1s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
.err-box{margin-top:6px;padding:10px 13px;border-radius:14px;background:var(--bad-bg);border:1px solid var(--bad-line);color:var(--bad);font-size:13.5px;line-height:1.5}
.cut{color:var(--bad);font-size:12.5px;margin-top:6px}
.acts{display:flex;align-items:center;gap:4px;margin-top:8px;flex-wrap:wrap}
.act{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:8px;font-size:12.5px;color:var(--mute)}
.act:active{background:var(--card);color:var(--fg)}
.det{margin-top:8px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13px}
.det div{display:flex;justify-content:space-between;gap:14px;padding:2.5px 0}
.det span:first-child{color:var(--mute);flex:none}
.det span:last-child{text-align:right;word-break:break-all;color:var(--fg2)}
.ok{color:var(--ok)!important}.diff{color:var(--bad)!important}

/* 严格复刻 IMG_1886.png 的 iOS 26 两行展开式圆角大输入框！ */
.composer-wrap{
  flex:none;padding:4px 12px calc(8px + env(safe-area-inset-bottom));
  background:var(--bg);position:relative;z-index:6;transition:padding .15s
}
body.kb-open .composer-wrap{padding-bottom:8px}
#atts{display:none;gap:8px;padding:0 2px 8px;overflow-x:auto}
.ch{position:relative;flex:none}
.ch img{width:54px;height:54px;object-fit:cover;border-radius:12px;display:block;border:1px solid var(--line)}
.ch span{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 11px;font-size:12.5px;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg2)}
.ch button{position:absolute;top:-5px;right:-5px;width:19px;height:19px;border-radius:10px;background:var(--black);color:var(--black-fg);font-size:10px;display:flex;align-items:center;justify-content:center}

.composer-card{
  background:var(--surface);border:1px solid var(--glass-border);
  border-radius:26px;padding:10px 12px 8px 14px;
  box-shadow:0 4px 22px rgba(0,0,0,.07),inset 0 1px 0 var(--glass-line);
  display:flex;flex-direction:column;gap:6px;
  transition:border-color .18s,box-shadow .18s
}
.composer-card:focus-within{border-color:rgba(0,0,0,.18);box-shadow:0 6px 26px rgba(0,0,0,.1)}
.ta-row{display:flex;align-items:flex-start;gap:4px}
#ta{
  flex:1;width:100%;resize:none;min-height:26px;max-height:36vh;border:0;
  background:transparent;color:var(--fg);padding:2px 2px;
  font-family:inherit;font-size:16px;line-height:1.48;outline:none;
  overflow-y:auto;-webkit-overflow-scrolling:touch
}
#ta::placeholder{color:var(--mute)}
#taExpand{
  width:28px;height:28px;border-radius:8px;color:var(--mute);
  display:none;align-items:center;justify-content:center;flex:none
}
#taExpand.show{display:inline-flex}
#taExpand svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.composer-card.tall #ta{min-height:34vh;max-height:52vh}

/* 底部图标工具栏（严格复刻 IMG_1886.png：左 ＋ / 盾牌，右 ⚡ / 仪表盘 / 麦克风 / 黑色↑） */
.c-bar{display:flex;align-items:center;justify-content:space-between;gap:6px;padding-top:2px}
.c-left,.c-right{display:flex;align-items:center;gap:4px}
.c-ico{
  width:36px;height:36px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;color:var(--fg);
  position:relative;transition:transform .13s,background .13s,color .13s
}
.c-ico:active{transform:scale(.88);background:var(--card)}
.c-ico svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.c-ico.active{color:var(--fg);background:var(--card)}
.c-ico.bolt-on{color:var(--amber)}
.c-ico.rec{color:var(--bad);background:var(--bad-bg)}
.dial-badge{
  position:absolute;bottom:2px;right:1px;font-size:8.5px;font-weight:700;
  background:var(--black);color:var(--black-fg);padding:0 3.5px;border-radius:5px;line-height:12px
}
#send{
  width:36px;height:36px;border-radius:50%;
  background:var(--black);color:var(--black-fg);
  display:inline-flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:700;flex:none;margin-left:2px;transition:transform .13s
}
#send:active{transform:scale(.88)}

/* 严格复刻 IMG_1887.png 的悬浮 6 档液态玻璃滑块（贴合键盘上方弹出） */
.effort-mask{
  position:fixed;inset:0;background:rgba(255,255,255,.35);z-index:33;
  display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
  padding:16px 18px calc(22px + env(safe-area-inset-bottom));
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  opacity:0;pointer-events:none;transition:opacity .2s ease
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .effort-mask{background:rgba(0,0,0,.45)}}
:root[data-theme=dark] .effort-mask{background:rgba(0,0,0,.45)}
.effort-mask.on{opacity:1;pointer-events:auto}
.effort-box{
  width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:14px;
  transform:translateY(16px) scale(.96);transition:transform .26s cubic-bezier(.22,1,.36,1)
}
.effort-mask.on .effort-box{transform:none}
.effort-head{
  display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:16px;
  font-size:20px;font-weight:600;color:var(--fg);letter-spacing:-.2px
}
.effort-head:active{background:var(--card)}
.effort-head .eh-lv{color:var(--mute);font-weight:500}
.effort-head .eh-arr{color:var(--mute);font-size:17px}
.slider-shell{
  width:100%;height:74px;padding:9px;border-radius:37px;position:relative;
  background:var(--glass-strong);border:1px solid var(--glass-border);
  box-shadow:0 12px 38px rgba(0,0,0,.14),inset 0 1px 1px var(--glass-line);
  touch-action:none;user-select:none;-webkit-user-select:none
}
.slider-track{position:relative;width:100%;height:100%;border-radius:28px;background:var(--track);overflow:hidden}
.slider-fill{position:absolute;top:0;bottom:0;left:0;border-radius:28px;background:var(--black);transition:width .16s cubic-bezier(.22,1,.36,1)}
.slider-shell.dragging .slider-fill{transition:none}
.slider-dots{position:absolute;inset:0;display:grid;grid-template-columns:repeat(6,1fr);align-items:center;justify-items:center;pointer-events:none;z-index:2}
.slider-dot{width:8px;height:8px;border-radius:50%;background:var(--dot);transition:background .15s}
.slider-dot.passed{background:var(--dot-on)}
.slider-dot.cur{opacity:0}
.slider-knob{
  position:absolute;top:4px;bottom:4px;width:48px;border-radius:24px;
  background:var(--bg);box-shadow:0 3px 12px rgba(0,0,0,.22);z-index:3;
  transition:left .16s cubic-bezier(.22,1,.36,1),transform .14s;pointer-events:none
}
.slider-shell.dragging .slider-knob{transition:transform .12s;transform:scale(1.06)}
.effort-ticks{width:100%;display:grid;grid-template-columns:repeat(6,1fr);text-align:center;font-size:12px;color:var(--mute);margin-top:-6px}
.effort-ticks span.on{color:var(--fg);font-weight:600}
.adv-card{
  width:100%;background:var(--glass-strong);border:1px solid var(--glass-border);
  border-radius:24px;padding:4px 14px;box-shadow:var(--shadow);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)
}
.adv-row{width:100%;display:flex;align-items:center;justify-content:space-between;padding:11px 2px;border-bottom:1px solid var(--line);font-size:14.5px}
.adv-row:last-child{border-bottom:0}
.adv-row span:first-child{color:var(--fg);font-weight:500}
.adv-row span:last-child{color:var(--fg2);display:inline-flex;align-items:center;gap:5px}

/* 左侧抽屉 */
.drawer-mask{position:fixed;inset:0;background:rgba(0,0,0,.34);z-index:20;opacity:0;pointer-events:none;transition:opacity .26s ease;backdrop-filter:blur(3px)}
.drawer-mask.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;bottom:0;left:0;width:82%;max-width:330px;
  background:var(--bg);z-index:21;display:flex;flex-direction:column;
  transform:translateX(-100%);transition:transform .28s cubic-bezier(.22,1,.36,1);
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
  box-shadow:6px 0 30px rgba(0,0,0,.15)
}
.drawer.on{transform:translateX(0)}
.d-top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px}
.d-brand{font-size:21px;font-weight:700;letter-spacing:-.4px}
.d-search-wrap{padding:0 16px 8px;display:none}
.d-search-wrap.on{display:block}
.d-search-wrap input{width:100%;padding:9px 13px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:14.5px;outline:none}
.d-nav{padding:4px 10px 8px}
.d-item{width:100%;display:flex;align-items:center;gap:13px;padding:11px 12px;border-radius:14px;font-size:15.5px;font-weight:500;color:var(--fg);text-align:left}
.d-item:active,.d-item.on{background:var(--card)}
.d-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;color:var(--fg);flex:none}
.d-item .badge{margin-left:auto;font-size:12px;color:var(--mute);font-weight:400}
.d-sec{padding:14px 20px 6px;font-size:13px;font-weight:600;color:var(--fg)}
.d-hr{height:1px;background:var(--line);margin:8px 18px}
.d-list{flex:1;overflow-y:auto;padding:0 10px 14px;-webkit-overflow-scrolling:touch}
.cv{display:flex;align-items:center;gap:2px;margin-bottom:2px}
.cv .opt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:10px 12px;border-radius:12px;font-size:15px;color:var(--fg)}
.cv .opt.on{background:var(--card);font-weight:600}
.cv .opt.on::after{content:none}
.cv .more-cv{color:var(--mute);padding:6px 8px;font-size:16px;border-radius:8px;flex:none}
.d-foot{padding:10px 16px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg)}
.new-pill{display:inline-flex;align-items:center;gap:8px;background:var(--black);color:var(--black-fg);padding:11px 22px;border-radius:26px;font-size:15.5px;font-weight:600;box-shadow:var(--shadow-sm)}
.new-pill svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.u-av-btn{width:44px;height:44px;border-radius:50%;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center;padding:4px}
.u-av-in{width:100%;height:100%;border-radius:50%;background:#6b7cff;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px}

.pop-mask{position:fixed;inset:0;background:rgba(0,0,0,.22);z-index:36;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .2s}
.pop-mask.on{opacity:1;pointer-events:auto}
.pop-card{width:268px;max-height:68vh;overflow-y:auto;background:var(--glass-strong);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border:1px solid var(--glass-border);border-radius:24px;padding:10px 8px;box-shadow:0 16px 46px rgba(0,0,0,.22);transform:scale(.92);transition:transform .24s cubic-bezier(.22,1,.36,1)}
.pop-mask.on .pop-card{transform:scale(1)}
.pop-grp{padding:8px 14px 4px;font-size:12px;color:var(--mute);font-weight:600}
.pop-hr{height:1px;background:var(--line);margin:6px 12px}
.pop-opt{width:100%;display:flex;align-items:center;gap:8px;padding:10.5px 12px;border-radius:14px;font-size:15px;text-align:left;color:var(--fg)}
.pop-opt:active{background:var(--card)}
.pop-opt .ck{width:16px;font-weight:700;color:var(--fg);flex:none}
.pop-opt .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.full-modal{position:fixed;inset:0;background:var(--bg2);z-index:28;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);transform:translateY(100%);pointer-events:none;transition:transform .3s cubic-bezier(.22,1,.36,1)}
.full-modal.on{transform:translateY(0);pointer-events:auto}
.fm-top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
.fm-title{font-size:17px;font-weight:600}
.fm-body{flex:1;overflow-y:auto;padding:8px 16px 28px;-webkit-overflow-scrolling:touch}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:32;display:flex;align-items:flex-end;backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .22s ease}
.sheet.on{opacity:1;pointer-events:auto}
.panel{background:var(--bg2);width:100%;max-height:88%;overflow-y:auto;border-radius:26px 26px 0 0;padding:12px 16px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .28s cubic-bezier(.22,1,.36,1)}
.sheet.on .panel{transform:translateY(0)}
.panel-bar{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.panel h3{margin:0 0 12px;font-size:17px;font-weight:600}

.set-group{background:var(--surface);border-radius:22px;overflow:hidden;margin-bottom:16px;border:1px solid var(--line)}
.set-row{width:100%;display:flex;align-items:center;gap:13px;padding:14px 16px;text-align:left;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row:active{background:var(--card)}
.set-row svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;color:var(--fg);flex:none}
.set-row .sr-t{font-size:15.5px;font-weight:500;color:var(--fg)}
.set-row .sr-d{font-size:12.5px;color:var(--mute);margin-top:2px}
.set-row .sr-v{margin-left:auto;font-size:14px;color:var(--mute);display:flex;align-items:center;gap:6px;flex:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.card label{display:block;font-size:12.5px;color:var(--fg2);margin:10px 0 4px;font-weight:500}
.card label:first-child{margin-top:0}
.card input,.card select,.card textarea{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--fg);padding:10px 12px;font-size:15.5px;outline:none}
.card textarea{min-height:84px;font-size:14.5px;line-height:1.5}
.card textarea.mono{font-family:ui-monospace,Menlo,monospace;font-size:13.5px}
.sw-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}
.sw-row .sw-t{font-size:15px;font-weight:500}.sw-row .sw-d{font-size:12.5px;color:var(--mute);margin-top:2px}
.sw{position:relative;width:48px;height:28px;border-radius:14px;background:var(--line);flex:none;transition:background .2s}
.sw.on{background:var(--black)}
.sw::after{content:"";position:absolute;top:2.5px;left:2.5px;width:23px;height:23px;border-radius:50%;background:var(--bg);transition:transform .2s cubic-bezier(.22,1,.36,1);box-shadow:0 1px 3px rgba(0,0,0,.22)}
.sw.on::after{transform:translateX(20px)}
.mem-item{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);margin-bottom:8px;font-size:14px}
.mem-item button{color:var(--mute);padding:2px 6px;flex:none}
.row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.btn{padding:10px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:14.5px;font-weight:500}
.btn.p{background:var(--black);color:var(--black-fg);border-color:var(--black)}
.btn.d{color:var(--bad)}

.plus-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.pg-tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:14px;font-weight:500}
.pg-tile svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.prev-modal{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}
.prev-modal.on{display:flex}
.prev-top{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--line)}
.prev-modal iframe{flex:1;border:0;width:100%;background:#fff}

#toast{
  position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 60px);transform:translateX(-50%) translateY(-6px);
  background:var(--black);color:var(--black-fg);padding:8px 16px;border-radius:20px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:88%;text-align:center;box-shadow:var(--shadow)
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="g-btn" id="hist" title="菜单" aria-label="菜单">
      <svg viewBox="0 0 24 24"><line x1="5" y1="9" x2="19" y2="9"/><line x1="5" y1="15" x2="14" y2="15"/></svg>
    </button>
    <div class="seg" id="modeSeg">
      <button data-mode="chat" class="on">聊天</button>
      <button data-mode="forge">Forge</button>
    </div>
    <div class="top-right">
      <button id="new" title="新对话" aria-label="新对话">
        <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>

<script>
const $=s=>document.querySelector(s);
const ls={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}}};
const BASE={openai:'https://api.openai.com/v1',deepseek:'https://api.deepseek.com/v1',anthropic:'https://api.anthropic.com',gemini:'https://generativelanguage.googleapis.com'};
const TYPES={openai:'OpenAI 兼容（大多数服务商）',deepseek:'DeepSeek',anthropic:'Anthropic Claude',gemini:'Google Gemini'};
const DEFAULT_MODELS={deepseek:['deepseek-chat','deepseek-reasoner','deepseek-v4-pro','deepseek-v4-flash']};
const EXT_MAP={html:'html',htm:'html',css:'css',js:'js',javascript:'js',ts:'ts',typescript:'ts',py:'py',python:'py',json:'json',md:'md',markdown:'md',sh:'sh',bash:'sh',sql:'sql',xml:'xml',yaml:'yml',yml:'yml',java:'java',c:'c',cpp:'cpp',go:'go',rs:'rs',rust:'rs',txt:'txt',csv:'csv'};

/* 6 档思考深度：同时驱动 DeepSeek V4 原生 reasoning_effort 参数 + 精细语义思考引导 */
const EFFORTS=[
  {key:'low',label:'低',short:'低',api:'low',prompt:'【思考深度：低】进行轻量思考，直抓重点、简洁干脆地作答，避免多余铺垫。'},
  {key:'medium',label:'中',short:'中',api:'medium',prompt:''},
  {key:'high',label:'高',short:'高',api:'high',prompt:'【思考深度：高】请深入分析问题本质与关键细节，给出严谨、条理清晰的高质量回答。'},
  {key:'xhigh',label:'极高',short:'极',api:'xhigh',prompt:'【思考深度：极高】请进行系统性深度推敲，主动排查边界情况与潜在漏洞后再给出完整方案。'},
  {key:'max',label:'Max',short:'M',api:'max',prompt:'【思考深度：Max】请启用高深度推理，全面拆解所有约束条件并逐项验证，输出高质量最终结果。'},
  {key:'ultra',label:'Ultra',short:'U',api:'max',prompt:'【思考深度：Ultra】请启用最高深度与自我核验：先全面推演方案、反复检查每一个细节和边界，再交付零疏漏的终极完整结果。'}
];
const TEMPS=[{v:0.0,t:'0.0（代码精准）'},{v:0.7,t:'0.7（均衡）'},{v:1.0,t:'1.0（默认）'},{v:1.3,t:'1.3（自然对话）'},{v:1.5,t:'1.5（创意发散）'}];

/* iOS Safari 键盘弹起/收起全链路丝滑适配：点空白处或下拉自动收键盘，输入框紧跟输入法落回底部 */
let vpTimer=0;
function syncViewport(){
  const vv=window.visualViewport;
  const h=vv?Math.round(vv.height):window.innerHeight;
  document.documentElement.style.setProperty('--vh',h+'px');
  const kbOpen=vv?(window.innerHeight-h)>110:false;
  document.body.classList.toggle('kb-open',kbOpen);
  if(window.scrollY!==0||window.scrollX!==0)window.scrollTo(0,0);
  if(kbOpen){const L=$('#list');if(L&&L.scrollHeight-L.scrollTop-L.clientHeight<160)L.scrollTop=L.scrollHeight}
}
function scheduleVp(){
  syncViewport();
  clearTimeout(vpTimer);
  vpTimer=setTimeout(()=>{syncViewport();setTimeout(syncViewport,180)},60);
}
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',syncViewport);
  window.visualViewport.addEventListener('scroll',syncViewport);
  syncViewport();
}
window.addEventListener('orientationchange',scheduleVp);
$('#ta').addEventListener('focus',scheduleVp);
$('#ta').addEventListener('blur',()=>{scheduleVp();setTimeout(syncViewport,320)});
/* 点击聊天空白区或顶栏收起键盘 */
$('#list').addEventListener('pointerdown',e=>{
  if(document.activeElement===$('#ta')&&!e.target.closest('button,a,input,textarea'))$('#ta').blur();
});
document.querySelector('header').addEventListener('pointerdown',()=>{
  if(document.activeElement===$('#ta'))$('#ta').blur();
});
/* 聊天区手指下拉轻扫收起键盘 + 屏幕左边缘右滑拉出侧边栏（仿原生 iOS 手势） */
{
  let sx=0,sy=0,edge=false;
  document.addEventListener('touchstart',e=>{
    const t=e.touches[0];if(!t)return;
    sx=t.clientX;sy=t.clientY;edge=sx<26;
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    const t=e.touches[0];if(!t)return;
    const dx=t.clientX-sx,dy=t.clientY-sy;
    if(edge&&dx>55&&Math.abs(dy)<40){edge=false;$('#ta').blur();openDrawer()}
    else if(document.activeElement===$('#ta')&&dy>36&&Math.abs(dx)<30&&e.target.closest('#list')){$('#ta').blur()}
  },{passive:true});
}

let channels=ls.get('ch',[]),sel=ls.get('sel',null),busy=false,convs=ls.get('convs',null),cid=ls.get('cid',null),msgs=[];
let cfg=Object.assign({
  ctxOn:true,ctxTurns:30,memOn:false,autoExpandThink:false,autoExpandCode:false,
  mode:'chat',effort:1,fastMode:false,dsThinking:true,dsNativeParams:true,temp:1.0,maxTokens:0,remoteOn:false,remoteUrl:'',remoteKey:'',
  theme:'auto',nick:'',style:'',sys:''
},ls.get('cfg',{}));
if(cfg.mode==='work')cfg.mode='forge';
let mems=ls.get('mems',[]);
const proxyNoExtra=new Set(); /* 自动降级记录：若某渠道中转不支持 thinking/reasoning_effort，自动静默回退不报错 */

function applyTheme(){
  if(cfg.theme==='dark'||cfg.theme==='light')document.documentElement.setAttribute('data-theme',cfg.theme);
  else document.documentElement.removeAttribute('data-theme');
}
applyTheme();

const packConvs=(keepAttText=true,maxMsgs=60)=>convs.map(c=>({
  id:c.id,title:c.title,ts:c.ts,pinned:!!c.pinned,note:c.note||'',
  files:keepAttText?(c.files||[]):[],
  msgs:c.msgs.slice(-maxMsgs).map(m=>{const{streaming,t0,thinkStart,...r}=m;if(r.atts)r.atts=r.atts.map(a=>keepAttText?{kind:a.kind,name:a.name,text:a.text}:{kind:a.kind,name:a.name});return r})
}));
const save=()=>{
  ls.set('ch',channels);ls.set('sel',sel);ls.set('cid',cid);ls.set('cfg',cfg);ls.set('mems',mems);
  if(ls.set('convs',packConvs(true,60)))return;
  if(ls.set('convs',packConvs(false,60))){toast('本地空间不足，已省略历史文本缓存');return}
  if(ls.set('convs',packConvs(false,20))){toast('本地空间不足，已精简旧对话缓存');return}
  toast('本地存储已满，建议删除部分旧对话')};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const newConv=()=>({id:uid(),title:'新对话',msgs:[],files:[],ts:Date.now(),pinned:false,note:''});
if(!convs){convs=[];const old=ls.get('msgs',[]);if(old.length){const c=newConv();c.msgs=old;c.title=(old.find(m=>m.role==='user')?.text||'之前的对话').slice(0,24);convs.push(c)}}
convs.forEach(c=>{if(c.pinned==null)c.pinned=false;if(!Array.isArray(c.files))c.files=[];c.msgs.forEach(m=>{delete m.streaming;delete m.t0;delete m.thinkStart;if(typeof m.text!=='string')m.text='';if(m.role==='assistant'&&!m.text&&!m.think){m.err=true;m.text='上次生成未完成'}})});
{let c=convs.find(c=>c.id===cid)||convs[0];if(!c){c=newConv();convs.push(c)}cid=c.id;msgs=c.msgs}
const curConv=()=>convs.find(c=>c.id===cid)||convs[0];
const cur=()=>{const c=channels.find(c=>c.id===sel?.ch);return c&&sel.m?{c,m:sel.m}:null};
const curEff=()=>EFFORTS[Math.max(0,Math.min(EFFORTS.length-1,cfg.effort??1))];
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}

function downloadFile(name,content,mime='text/plain;charset=utf-8'){
  const blob=new Blob([content],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  toast('已保存文件：'+name)}
const fmtSize=s=>{const b=new Blob([s]).size;return b<1024?(b+' B'):((b/1024).toFixed(1)+' KB')};

/* ---- Forge 工作区 ---- */
function renderForgeBar(){
  const bar=$('#forgeBar'),cv=curConv();
  const isForge=cfg.mode==='forge';
  bar.classList.toggle('on',isForge);
  if(!isForge)return;
  const fs=cv.files||[];
  const rOn=cfg.remoteOn&&cfg.remoteUrl;
  bar.innerHTML='<span class="fb-tag">FORGE</span>'+
    '<button class="fb-file" id="fbRemote" style="'+(rOn?'border-color:var(--ok);color:var(--ok)':'')+'">'+(rOn?'● 已连远程计算机':'○ 连接电脑/云端')+'</button>'+
    fs.map((f,i)=>'<span class="fb-file" data-fview="'+i+'"><span>'+esc(f.name)+'</span><span class="fb-sz">'+fmtSize(f.text)+'</span><button class="fb-x" data-fdel="'+i+'">✕</button></span>').join('')+
    '<button class="fb-add" id="fbAdd">＋ 挂载代码文件</button>';
}
function openRemoteAgent(){
  const P=$('#pmod');
  P.innerHTML='<div class="panel-bar"></div><h3>Forge 远程连接（电脑 / 云端智能体）</h3>'+
    '<div class="card">'+
      '<div class="sw-row"><div><div class="sw-t">启用远程智能体</div><div class="sw-d">开启后，Forge 模式会把指令发到你电脑或云服务器上的 OpenAI 兼容 Agent 网关</div></div><button class="sw'+(cfg.remoteOn?' on':'')+'" id="swRem"></button></div>'+
      '<label>电脑 / 云端网关地址（需支持 HTTPS 或局域网）</label><input id="remUrl" value="'+esc(cfg.remoteUrl||'')+'" placeholder="例如：https://my-pc.trycloudflare.com/v1" autocapitalize="off" autocorrect="off">'+
      '<label>访问密钥 / Token（可选）</label><input id="remKey" type="password" value="'+esc(cfg.remoteKey||'')+'" placeholder="如果网关设了密码填这里" autocapitalize="off" autocorrect="off">'+
    '</div>'+
    '<div class="row"><button class="btn p" id="remSave">保存</button><button class="btn" id="remTest">测试连接</button><button class="btn" id="remClose">关闭</button></div>';
  $('#smod').classList.add('on');
  $('#swRem').onclick=()=>{cfg.remoteOn=!cfg.remoteOn;save();renderForgeBar();openRemoteAgent()};
  $('#remSave').onclick=()=>{cfg.remoteUrl=$('#remUrl').value.trim();cfg.remoteKey=$('#remKey').value.trim();save();renderForgeBar();$('#smod').classList.remove('on');toast('已保存远程配置')};
  $('#remTest').onclick=async()=>{
    const u=$('#remUrl').value.trim(),k=$('#remKey').value.trim();
    if(!u){toast('先填网关地址');return}
    toast('正在测试连接…');
    try{const h=k?{authorization:'Bearer '+k}:{};const r=await fetch(oaiBase(u)+'/models',{headers:h});if(r.ok)toast('连接成功！');else toast('连接返回 HTTP '+r.status)}
    catch{toast('连不上：请检查电脑是否开机、网络与 HTTPS 地址')}
  };
  $('#remClose').onclick=()=>$('#smod').classList.remove('on');
}
$('#forgeBar').onclick=e=>{
  const cv=curConv();
  if(e.target.closest('#fbRemote')){openRemoteAgent();return}
  if(e.target.closest('#fbAdd')){$('#forgeFile').click();return}
  const del=e.target.closest('[data-fdel]');
  if(del){cv.files.splice(+del.dataset.fdel,1);save();renderForgeBar();toast('已移出工作区');return}
  const vw=e.target.closest('[data-fview]');
  if(vw){
    const f=cv.files[+vw.dataset.fview];if(!f)return;
    const P=$('#pmod');
    P.innerHTML='<div class="panel-bar"></div><h3>'+esc(f.name)+'（工作区最新版）</h3>'+
      '<div class="card"><pre style="margin:0;max-height:50vh;overflow:auto;font-size:12.5px"><code>'+esc(f.text.slice(0,40000))+'</code></pre></div>'+
      '<div class="row"><button class="btn p" id="fvDl">保存文件</button><button class="btn" id="fvCl">关闭</button></div>';
    $('#smod').classList.add('on');
    $('#fvDl').onclick=()=>downloadFile(f.name,f.text,/\.html?$/i.test(f.name)?'text/html;charset=utf-8':'text/plain;charset=utf-8');
    $('#fvCl').onclick=()=>$('#smod').classList.remove('on');
  }
};

/* ---- Markdown ---- */
let codeStore=[];
const openCodeKeys=new Set();
function inlineMd(s){
  return s.split(/(`[^`\n]+`)/g).map((q,j)=>j%2
    ?'<code>'+esc(q.slice(1,-1))+'</code>'
    :esc(q).replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>')
  ).join('')}
function md(s,isStreaming=false,msgKey=''){
  const parts=String(s).split(/(```[^\n]*\n?[\s\S]*?(?:```|$))/g);
  return parts.map((p,i)=>{
    if(i%2){
      const closed=/```$/.test(p);
      const m=p.match(/^```([^\n]*)\n?([\s\S]*?)(?:```)?$/);
      const info=(m?.[1]||'').trim(),code=(m?.[2]||'').replace(/\n$/,'');
      let lang=info,fname='';
      if(info.includes(':')){const sp=info.split(':');lang=sp[0].trim();fname=sp.slice(1).join(':').trim()}
      else if(info.includes('.')){fname=info;lang=info.split('.').pop().toLowerCase()}
      const ext=EXT_MAP[lang.toLowerCase()]||'txt';
      const isHtml=ext==='html'||/^\s*<!doctype\s+html/i.test(code)||/^\s*<html/i.test(code);
      if(!fname)fname=isHtml?'index.html':('code.'+ext);
      const lineCount=code?code.split('\n').length:0;
      const key=msgKey+':'+i;
      const isOpen=cfg.autoExpandCode||openCodeKeys.has(key);
      const idx=codeStore.push({code,fname,isHtml,key})-1;
      const tag=(ext||'FILE').toUpperCase().slice(0,4);
      const meta=isStreaming&&!closed?('正在编写… '+fmtSize(code)):(fmtSize(code)+' · '+lineCount+' 行');
      return'<div class="file-card'+(isOpen?' open':'')+'" data-ckey="'+esc(key)+'">'+
        '<div class="file-head" data-ftog="'+idx+'">'+
          '<div class="file-ico">'+esc(tag)+'</div>'+
          '<div class="file-info"><div class="file-name">'+esc(fname)+'</div><div class="file-meta">'+esc(meta)+'</div></div>'+
          '<span class="file-arr">▸</span>'+
        '</div>'+
        '<div class="file-bar">'+
          '<button class="fbtn pri" data-dl="'+idx+'">保存文件</button>'+
          (isHtml?'<button class="fbtn" data-prev="'+idx+'">预览</button>':'')+
          '<button class="fbtn" data-sync="'+idx+'">同步到 Forge</button>'+
          '<button class="fbtn" data-code="'+idx+'">复制</button>'+
          '<button class="fbtn" data-ftog="'+idx+'">'+(isOpen?'收起代码':'展开代码')+'</button>'+
        '</div>'+
        '<div class="file-src"><pre><code>'+(isOpen?esc(code):'')+'</code></pre></div>'+
      '</div>';
    }
    const lines=p.split('\n');let out='',inUl=false,inOl=false,tbl=[];
    const closeLists=()=>{if(inUl){out+='</ul>';inUl=false}if(inOl){out+='</ol>';inOl=false}};
    const flushTbl=()=>{
      if(!tbl.length)return;
      const rows=tbl.map(r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim()));
      if(rows.length>=2&&rows[1].every(c=>/^:?-{2,}:?$/.test(c))){
        out+='<div class="tbl-wrap"><table><thead><tr>'+rows[0].map(c=>'<th>'+inlineMd(c)+'</th>').join('')+'</tr></thead><tbody>'+
          rows.slice(2).map(r=>'<tr>'+r.map(c=>'<td>'+inlineMd(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
      }else{rows.forEach(r=>{out+='<p>'+inlineMd(r.join(' | '))+'</p>'})}
      tbl=[]};
    for(const raw of lines){
      if(/^\s*\|.+\|\s*$/.test(raw)){closeLists();tbl.push(raw.trim());continue}
      flushTbl();
      const h=raw.match(/^(#{1,4})\s+(.+)$/);
      if(h){closeLists();out+='<h'+h[1].length+'>'+inlineMd(h[2])+'</h'+h[1].length+'>';continue}
      const ul=raw.match(/^\s*[-*•]\s+(.+)$/);
      if(ul){if(inOl){out+='</ol>';inOl=false}if(!inUl){out+='<ul>';inUl=true}out+='<li>'+inlineMd(ul[1])+'</li>';continue}
      const ol=raw.match(/^\s*\d+\.\s+(.+)$/);
      if(ol){if(inUl){out+='</ul>';inUl=false}if(!inOl){out+='<ol>';inOl=true}out+='<li>'+inlineMd(ol[1])+'</li>';continue}
      const bq=raw.match(/^>\s?(.*)$/);
      if(bq){closeLists();out+='<blockquote>'+inlineMd(bq[1])+'</blockquote>';continue}
      closeLists();
      if(raw.trim())out+='<p>'+inlineMd(raw)+'</p>';
    }
    flushTbl();closeLists();
    return out;
  }).join('')}

/* 系统提示词保持稳定前缀，最大化命中 DeepSeek 硬盘上下文缓存（省 90% 输入费用！） */
function buildSystemPrompt(conv){
  const parts=[];
  if(cfg.mode==='forge'){
    parts.push('你现在处于【Forge 代码工坊】专属工程模式。请严格遵守：\n1. 只修改用户要求的功能和 Bug，严禁随意删改原有正常功能。\n2. 输出修改后的文件时，必须使用带文件名的完整代码块（如 ```html:index.html ），严禁使用“// 其余代码省略”。\n3. 解释尽量精炼，把篇幅集中在代码质量与精准修改上。');
    if(conv?.files?.length){
      parts.push('以下是当前 Forge 工作区的最新源码文件（请直接基于这些最新版文件修改）：\n'+
        conv.files.map(f=>'【工作区文件：'+f.name+'】\n```\n'+f.text+'\n```').join('\n\n'));
    }
  }else{
    parts.push('当用户要求生成文件或代码时，请直接用带文件名的代码块输出完整内容（如 ```html:index.html ），客户端会自动提供一键保存文件按钮。');
  }
  const ef=curEff();
  if(ef.prompt)parts.push(ef.prompt);
  if(cfg.fastMode)parts.push('【速度模式：快速 ⚡】请干脆利落、直奔结论、减少客套和冗余铺垫。');
  if(cfg.nick)parts.push('用户希望你称呼他/她为：'+cfg.nick);
  if(cfg.style)parts.push('回答风格偏好：'+cfg.style);
  if(cfg.sys)parts.push(cfg.sys);
  if(conv?.note)parts.push('当前对话专属背景/记忆：\n'+conv.note);
  if(cfg.memOn&&mems.length)parts.push('跨对话全局记忆：\n'+mems.map((x,i)=>(i+1)+'. '+x).join('\n'));
  return parts.join('\n\n')}

const toURL=(f,mt)=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.replace(/^data:[^;,]*/,'data:'+mt));r.onerror=()=>no(new Error('文件读取失败'));r.readAsDataURL(f)});
function shrink(f){return new Promise((ok,no)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const w=i.naturalWidth||i.width,h=i.naturalHeight||i.height;if(!w||!h){URL.revokeObjectURL(u);no(new Error('尺寸无效'));return}const k=Math.min(1,1600/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.85))};i.onerror=()=>{URL.revokeObjectURL(u);no(new Error('解码失败'))};i.src=u})}
async function readFile(f){

function compactForForge(text){

}
function clean(src,conv){
  let out=[];
  const isForge=cfg.mode==='forge'&&conv?.files?.length>0;
  for(let i=0;i<src.length;i++){
    const m=src[i];
    if(m.streaming)continue;
    if(m.role==='assistant'&&m.err)continue;
    let txt=typeof m.text==='string'?m.text:'';
    if(isForge&&m.role==='assistant'&&i<src.length-2)txt=compactForForge(txt);
    if(!txt.trim()&&!(m.atts||[]).length)continue;
    const l=out[out.length-1];
    if(l&&l.role===m.role){
      if(m.role==='user'&&l.text.trim()&&l.text.trim()===txt.trim()&&!(m.atts&&m.atts.length))continue;
      l.text=(l.text&&txt?l.text+'\n\n':l.text)+txt;
      l.atts=[...(l.atts||[]),...(m.atts||[])]}
    else out.push({role:m.role,text:txt,atts:m.atts?[...m.atts]:undefined})}
  while(out.length&&out[0].role!=='user')out.shift();
  if(!cfg.ctxOn){const lastU=[...out].reverse().find(x=>x.role==='user');return lastU?[lastU]:[]}
  const maxMsgs=(cfg.ctxTurns||30)*2+1;
  if(out.length>maxMsgs){out=out.slice(-maxMsgs);while(out.length&&out[0].role!=='user')out.shift()}
  return out}

/* ---- 协议适配（全面接入 DeepSeek V4 原生 thinking / reasoning_effort / temperature / cache hit，带中转 400 自动降级） ---- */
const root=(b,t)=>{b=b.trim().replace(/\/+$/,'');return(t==='anthropic'||t==='gemini')?b.replace(/\/v1(beta)?$/,''):b};
const oaiBase=b=>{b=b.trim().replace(/\/+$/,'');try{const u=new URL(b);return u.pathname==='/'||u.pathname===''?b+'/v1':b}catch{return b}};
const errText=(j,raw)=>{const e=j&&(j.error?.message||j.error||j.message);return typeof e==='string'?e:raw.slice(0,200)};
function friendlyErr(e){
  const msg=String(e?.message||e||'未知错误');
  if(/load failed|failed to fetch|networkerror|network connection was lost|the internet connection appears to be offline/i.test(msg))
    return'网络连接中断（接口响应超时、文件过大，或手机切到了后台）';
  return msg}
async function http(url,opt){
  let r;try{r=await fetch(url,opt)}catch(e){throw new Error('网络请求失败：请检查接口地址、网络，或确认该服务支持浏览器直连')}
  const txt=await r.text();let j;try{j=JSON.parse(txt)}catch{}
  if(!r.ok)throw new Error('HTTP '+r.status+'：'+errText(j,txt));
  if(!j)throw new Error('返回内容不是 JSON：'+txt.slice(0,120));
  return j}
async function sse(url,opt,onEv){
  let r;try{r=await fetch(url,opt)}catch(e){if(e.name==='AbortError')throw e;throw new Error(friendlyErr(e))}
  if(!r.ok){const t=await r.text();let j;try{j=JSON.parse(t)}catch{}const err=new Error('HTTP '+r.status+'：'+errText(j,t));err.status=r.status;throw err}
  const eat=l=>{l=l.replace(/\r$/,'');if(!l.startsWith('data:'))return;const d=l.slice(5).trim();if(!d||d==='[DONE]')return;let j;try{j=JSON.parse(d)}catch{return}onEv(j)};
  if(!(r.headers.get('content-type')||'').includes('event-stream')){
    const t=await r.text();if(/^\s*(event:|data:)/m.test(t)){t.split('\n').forEach(eat);return}
    let j;try{j=JSON.parse(t)}catch{throw new Error('返回内容不是 JSON：'+t.slice(0,120))}
    if(Array.isArray(j))j.forEach(onEv);else onEv(j);return}
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
  try{
    for(;;){
      let res;try{res=await rd.read()}catch(e){if(e.name==='AbortError')throw e;throw new Error(friendlyErr(e))}
      if(res.done)break;
      buf+=dec.decode(res.value,{stream:true});
      let i;while((i=buf.indexOf('\n'))>=0){eat(buf.slice(0,i));buf=buf.slice(i+1)}
    }
    buf+=dec.decode();if(buf)buf.split('\n').forEach(eat)
  }finally{rd.cancel().catch(()=>{})}}

async function call(ch,model,hist,conv,on,allowExtra=true){
  const t0=performance.now(),t=ch.type,H={'content-type':'application/json'};let text='',think='',rm='',u={},cut=false,url,reqBody;
  const sysPrompt=buildSystemPrompt(conv),ef=curEff();
  const isDS=t==='deepseek'||/deepseek/i.test(model);
  const useExtra=allowExtra&&cfg.dsNativeParams&&!proxyNoExtra.has(ch.id);

  if(t==='anthropic'){
    url=root(ch.base,'anthropic')+'/v1/messages';
    Object.assign(H,{'x-api-key':ch.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'});
    reqBody={model,max_tokens:cfg.maxTokens||8192,stream:true,messages:hist.map(m=>({role:m.role,content:body(m,'anthropic')}))};
    if(sysPrompt)reqBody.system=sysPrompt;
  }else if(t==='gemini'){
    url=root(ch.base,'gemini')+'/v1beta/models/'+encodeURIComponent(model)+':streamGenerateContent?alt=sse';
    H['x-goog-api-key']=ch.key;
    reqBody={contents:hist.map(m=>({role:m.role==='user'?'user':'model',parts:body(m,'gemini')}))};
    if(sysPrompt)reqBody.systemInstruction={parts:[{text:sysPrompt}]};
  }else{
    const useRem=cfg.mode==='forge'&&cfg.remoteOn&&cfg.remoteUrl;
    url=oaiBase(useRem?cfg.remoteUrl:ch.base)+'/chat/completions';
    const keyToUse=useRem?cfg.remoteKey:ch.key;
    if(keyToUse)H.authorization='Bearer '+keyToUse;
    const ms=hist.map(m=>({role:m.role,content:body(m,'openai')}));
    if(sysPrompt)ms.unshift({role:'system',content:sysPrompt});
    reqBody={model,stream:true,stream_options:{include_usage:true},messages:ms};
    if(cfg.maxTokens>0)reqBody.max_tokens=cfg.maxTokens;
    if(useExtra&&isDS){
      reqBody.thinking={type:cfg.dsThinking?'enabled':'disabled'};
      if(cfg.dsThinking&&ef.api)reqBody.reasoning_effort=ef.api;
      else if(!cfg.dsThinking&&typeof cfg.temp==='number')reqBody.temperature=cfg.temp;
    }else if(useExtra&&typeof cfg.temp==='number'&&cfg.temp!==1.0){
      reqBody.temperature=cfg.temp;
    }
  }
  try{
    await sse(url,{method:'POST',headers:H,signal:ctl.signal,body:JSON.stringify(reqBody)},j=>{
      if(j.error)throw new Error(typeof j.error==='string'?j.error:String(j.error.message||JSON.stringify(j.error)).slice(0,200));
      if(t==='anthropic'){
        if(j.type==='message_start'){rm=j.message?.model||rm;u.i=j.message?.usage?.input_tokens}
        else if(j.type==='content_block_delta'){const d=j.delta||{};if(d.type==='text_delta'&&d.text)text+=d.text;else if(d.type==='thinking_delta'&&d.thinking)think+=d.thinking}
        else if(j.type==='message_delta'){if(j.usage?.output_tokens!=null)u.o=j.usage.output_tokens;if(j.delta?.stop_reason==='max_tokens')cut=true}
        else if(j.type==='message'){rm=j.model||rm;u={i:j.usage?.input_tokens,o:j.usage?.output_tokens};if(j.stop_reason==='max_tokens')cut=true;for(const b of j.content||[]){if(b.type==='text'&&b.text)text+=b.text;else if(b.type==='thinking'&&b.thinking)think+=b.thinking}}
      }else if(t==='gemini'){
        const cand=j.candidates?.[0];
        for(const p of cand?.content?.parts||[]){if(p.thought)think+=p.text||'';else text+=p.text||''}
        if(cand?.finishReason==='MAX_TOKENS')cut=true;
        rm=j.modelVersion||rm;if(j.usageMetadata)u={i:j.usageMetadata.promptTokenCount,o:j.usageMetadata.candidatesTokenCount}
      }else{
        const c=j.choices?.[0],d=c?.delta||c?.message||{};
        text+=typeof d.content==='string'?d.content:(d.content||[]).map(p=>p.text||'').join('');
        const rk=d.reasoning_content||d.reasoning;if(typeof rk==='string')think+=rk;
        if(c?.finish_reason==='length')cut=true;
        rm=j.model||rm;
        if(j.usage){
          u={
            i:j.usage.prompt_tokens,
            o:j.usage.completion_tokens,
            ch:j.usage.prompt_cache_hit_tokens??j.usage.prompt_tokens_details?.cached_tokens??null,
            cm:j.usage.prompt_cache_miss_tokens??null
          };
        }
      }
      on(text,think)});
  }catch(err){
    /* 若第三方中转不接受 thinking / reasoning_effort 返回 400/422，自动静默去掉扩展参数重发一次！ */
    if(allowExtra&&useExtra&&(err.status===400||err.status===422)&&!text&&!think){
      proxyNoExtra.add(ch.id);
      return await call(ch,model,hist,conv,on,false);
    }
    throw err;
  }
  if(!text)throw new Error('模型没有返回文字内容');
  return{text,think,rm:rm||'（接口未返回）',u,cut,ms:Math.round(performance.now()-t0)}}

async function listModels(ch){
  if(ch.type==='anthropic'){const j=await http(root(ch.base,'anthropic')+'/v1/models?limit=100',{headers:{'x-api-key':ch.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}});return list(j.data||j.models).map(x=>x.id||x.name).filter(Boolean)}
  if(ch.type==='gemini'){const j=await http(root(ch.base,'gemini')+'/v1beta/models?pageSize=200',{headers:{'x-goog-api-key':ch.key}});return list(j.models).filter(x=>(x.supportedGenerationMethods||[]).includes('generateContent')).map(x=>x.name.replace(/^models\//,'')).filter(Boolean)}
  const h=ch.key?{authorization:'Bearer '+ch.key}:{};
  const j=await http(oaiBase(ch.base)+'/models',{headers:h});return list(Array.isArray(j)?j:(j.data||j.models)).map(x=>typeof x==='string'?x:(x.id||x.name)).filter(Boolean).sort()}

/* ---- 渲染 ---- */
function same(a,b){a=a.toLowerCase().replace(/^models\//,'');b=b.toLowerCase().replace(/^models\//,'');if(a===b)return true;const[x,y]=a.length<b.length?[a,b]:[b,a];return y.startsWith(x+'-')&&/^(\d{4}-\d{2}-\d{2}|\d{8}|\d{4}|\d{3}|latest|preview.*)$/.test(y.slice(x.length+1))}
let softTimer=0;
function thinkLabelText(m){
  const wait=m.streaming&&!m.text;
  const open=m.to??cfg.autoExpandThink;
  const sec=m.t0?Math.max(1,Math.round((Date.now()-m.t0)/1000)):(m.thinkSec||0);
  return wait?('正在思考…'+(sec?' '+sec+'秒':'')):(open?'收起思考':'已思考 '+(m.thinkSec?m.thinkSec+' 秒':'完成'));
}
function msgHtml(m,i){
  if(m.role==='user')return'<div class="u-wrap"><div class="u" data-u="'+i+'">'+attHtml(m)+esc(m.text)+'</div></div>';
  const d=m.meta,wait=m.streaming&&!m.text,open=m.to??cfg.autoExpandThink;
  const rk=d?(d.rm.startsWith('（')?'':same(d.req,d.rm)?'ok':'diff'):'';
  const mkey=cid+'_'+i;
  let bodyHtml='';
  if(m.err){bodyHtml=(m.partial?'<div class="t">'+md(m.partial,false,mkey)+'</div>':'')+'<div class="err-box">'+esc(m.text)+'</div>'}
  else if(m.text){bodyHtml='<div class="t">'+md(m.text,m.streaming,mkey)+'</div>'}
  else if(m.streaming&&!m.think){bodyHtml='<div class="t"><div class="typing"><span></span><span></span><span></span></div></div>'}
  else{bodyHtml='<div class="t"></div>'}
  const acts=!m.streaming?('<div class="acts">'+
    (m.text&&!m.err?'<button class="act" data-c="'+i+'">复制</button><button class="act" data-save="'+i+'">存为文件</button>':'')+
    '<button class="act" data-re="'+i+'">重试</button>'+
    (m.err?'<button class="act" data-dm="'+i+'">删除</button>':'')+
    (d?'<button class="act" data-i="'+i+'">'+(m.open?'收起详情':'详情')+'</button>':'')+
    '</div>'):'';
  const cacheRow=(d&&d.u&&d.u.ch!=null)?('<div><span>缓存命中（省费）</span><span class="ok">'+d.u.ch+' token'+(d.u.i?('（'+Math.round(d.u.ch/d.u.i*100)+'%）'):'')+'</span></div>'):'';
  const det=(d&&m.open)?('<div class="det"><div><span>请求的模型</span><span>'+esc(d.req)+'</span></div><div><span>接口返回的模型</span><span class="'+rk+'">'+esc(d.rm)+(rk==='diff'?'（与请求不同）':'')+'</span></div><div><span>渠道</span><span>'+esc(d.ch)+'</span></div><div><span>协议</span><span>'+esc((TYPES[d.type]||d.type).split('（')[0])+'</span></div><div><span>耗时</span><span>'+(d.ms/1000).toFixed(1)+' 秒</span></div><div><span>Token</span><span>'+(d.u.i??'-')+' 入 / '+(d.u.o??'-')+' 出</span></div>'+cacheRow+'</div>'):'';
  return'<div class="a" data-idx="'+i+'">'+
    '<div class="th" style="display:'+(m.think?'block':'none')+'">'+
      '<button class="th-btn'+(open?' open':'')+'" data-t="'+i+'">'+
        (wait?'<span class="th-dot"></span>':'')+
        '<span class="th-lbl">'+thinkLabelText(m)+'</span>'+
        '<span class="th-arr">▸</span>'+
      '</button>'+
      '<div class="tk" style="display:'+(open&&m.think?'block':'none')+'">'+(open&&m.think?esc(m.think):'')+'</div>'+
    '</div>'+
    bodyHtml+
    (d?.cut?'<div class="cut">输出达到长度上限，内容可能已截断</div>':'')+
    acts+det+'</div>'}

const soft=()=>{
  if(softTimer)return;
  softTimer=setTimeout(()=>{
    softTimer=0;
    const L=$('#list'),i=msgs.length-1,m=msgs[i],e=L.lastElementChild;
    if(!m||m.role!=='assistant'||!e||!e.classList.contains('a')){render();return}
    const near=L.scrollHeight-L.scrollTop-L.clientHeight<90;
    const th=e.querySelector('.th');
    if(m.think&&th){
      th.style.display='block';
      const lbl=th.querySelector('.th-lbl');if(lbl)lbl.textContent=thinkLabelText(m);
      const dot=th.querySelector('.th-dot');if(m.text&&dot)dot.remove();
      const tk=th.querySelector('.tk');
      const open=m.to??cfg.autoExpandThink;
      if(tk&&open){
        const atBot=tk.scrollHeight-tk.scrollTop-tk.clientHeight<36;
        tk.style.display='block';tk.textContent=m.think;
        if(atBot)tk.scrollTop=tk.scrollHeight;
      }
    }
    const tEl=e.querySelector('.t');
    if(tEl&&m.text)tEl.innerHTML=md(m.text,true,cid+'_'+i);
    if(near)L.scrollTop=L.scrollHeight;
  },100)};

  const ft=e.target.closest('[data-ftog]');

    const it=codeStore[+ft.dataset.ftog];if(!it)return;

  if(cb){const it=codeStore[+cb.dataset.code];if(it)copyText(it.code).then(()=>toast('已复制代码'),()=>toast('复制失败'));return}
  const ub=e.target.closest('[data-u]');

    P.innerHTML='<div class="panel-bar"></div><h3>消息操作</h3>'+

    return}

  if(b.dataset.c!==undefined){copyText(msgs[+b.dataset.c].text).then(()=>toast('已复制'),()=>toast('复制失败'));return}
  if(b.dataset.save!==undefined){const m=msgs[+b.dataset.save];downloadFile((curConv()?.title||'回复')+'.md',m.text,'text/markdown;charset=utf-8');return}
  if(b.dataset.t!==undefined){

    const card=b.closest('.a'),tk=card?.querySelector('.tk'),lbl=b.querySelector('.th-lbl');

  if(b.dataset.dm!==undefined){if(busy)return;msgs.splice(+b.dataset.dm,1);save();render();return}
  if(b.dataset.re!==undefined){if(busy){toast('正在生成中');return}retryAt(+b.dataset.re);return}

/* ---- 发送与生成 ---- */
async function runAssist(hist,s,targetConv){
  busy=true;$('#send').textContent='■';ctl=new AbortController();
  const m={role:'assistant',text:'',think:'',streaming:true,t0:Date.now()};
  targetConv.msgs.push(m);save();render(true);
  try{
    const r=await call(s.c,s.m,hist,targetConv,(t,k)=>{
      if(k&&!t&&!m.thinkStart)m.thinkStart=Date.now();
      if(t&&m.thinkStart&&!m.thinkSec)m.thinkSec=Math.max(1,Math.round((Date.now()-m.thinkStart)/1000));
      m.text=t;m.think=k;soft();
    });
    if(m.thinkStart&&!m.thinkSec)m.thinkSec=Math.max(1,Math.round((Date.now()-m.thinkStart)/1000));
    delete m.t0;delete m.thinkStart;
    Object.assign(m,{text:r.text,think:r.think,streaming:false,meta:{req:s.m,rm:r.rm,ch:s.c.name,type:s.c.type,ms:r.ms,u:r.u,cut:r.cut}})
  }catch(e){
    delete m.t0;delete m.thinkStart;m.streaming=false;
    if(e.name==='AbortError'){if(!m.text){m.err=true;m.text='已停止生成'}}
    else{if(m.text)m.partial=m.text;m.err=true;m.text=friendlyErr(e)}
  }
  if(softTimer){clearTimeout(softTimer);softTimer=0}
  busy=false;$('#send').textContent='↑';save();render()
}
async function retryAt(idx){
  const s=cur();if(!s){toast('先选择模型');openModels();return}
  const cv=curConv();cv.msgs.splice(idx,1);
  const hist=clean(cv.msgs,cv);
  if(!hist.length){toast('没有可重试的消息');render();return}
  await runAssist(hist,s,cv);
}
async function send(){
  const ta=$('#ta'),text=ta.value.trim();if((!text&&!att.length)||busy)return;
  const s=cur();if(!s){toast('先选择模型');openModels();return}
  const cv=curConv();
  cv.ts=Date.now();
  if(cv.title==='新对话')cv.title=(text||att[0]?.name||'新对话').replace(/\s+/g,' ').slice(0,22);
  cv.msgs.push({role:'user',text,atts:att.length?att:undefined});
  att=[];drawAtts();ta.value='';$('#composerCard').classList.remove('tall');autoSizeTa();
  const hist=clean(cv.msgs,cv);
  await runAssist(hist,s,cv);
}

function collectLibrary(){
  const items=[];
  for(const c of convs){
    for(const m of c.msgs){
      if(m.role!=='assistant'||!m.text)continue;
      const parts=m.text.split(/(```[^\n]*\n?[\s\S]*?(?:```|$))/g);
      for(let i=1;i<parts.length;i+=2){
        const mm=parts[i].match(/^```([^\n]*)\n?([\s\S]*?)(?:```)?$/);
        const info=(mm?.[1]||'').trim(),code=(mm?.[2]||'').replace(/\n$/,'');
        if(!code.trim())continue;
        let lang=info,fname='';
        if(info.includes(':')){const sp=info.split(':');lang=sp[0].trim();fname=sp.slice(1).join(':').trim()}
        else if(info.includes('.')){fname=info;lang=info.split('.').pop().toLowerCase()}
        const ext=EXT_MAP[lang.toLowerCase()]||'txt';
        const isHtml=ext==='html'||/^\s*<!doctype\s+html/i.test(code)||/^\s*<html/i.test(code);
        if(!fname)fname=isHtml?'index.html':('code.'+ext);
        items.push({fname,code,isHtml,convTitle:c.title});
      }
    }
  }
  return items;
}
function openLibrary(){
  const items=collectLibrary();
  const P=$('#pmod');
  P.innerHTML='<div class="panel-bar"></div><h3>资料库（已生成文件）</h3>'+
    (items.length?items.map((it,i)=>'<div class="mem-item"><div><div style="font-weight:600">'+esc(it.fname)+'</div><div style="font-size:12px;color:var(--mute)">来自：'+esc(it.convTitle)+' · '+fmtSize(it.code)+'</div></div><button class="fbtn pri" data-libdl="'+i+'">保存</button></div>').join(''):'<div style="text-align:center;color:var(--mute);padding:26px 0;font-size:14px">还没有生成过代码或文件</div>');
  $('#smod').classList.add('on');
  P.querySelectorAll('[data-libdl]').forEach(b=>b.onclick=()=>{const it=items[+b.dataset.libdl];if(it)downloadFile(it.fname,it.code,it.isHtml?'text/html;charset=utf-8':'text/plain;charset=utf-8')});
}

$('#apiClose').onclick=()=>{$('#apiModal').classList.remove('on');if($('#setModal').classList.contains('on'))openSettings();render()};
function syncField(el){
  const k=el.dataset.k,card=el.closest('.card');if(!k||!card)return;
  const c=channels.find(x=>x.id===card.dataset.id);if(!c)return;
  if(k==='models'){c.models=el.value.split('\n').map(s=>s.trim()).filter(Boolean);if(sel?.ch===c.id&&!c.models.includes(sel.m))sel=null}
  else if(k==='type'){
    const old=c.type;c.type=el.value;
    if(!c.base||c.base===BASE[old])c.base=BASE[c.type];
    if(!c.models.length&&DEFAULT_MODELS[c.type])c.models=[...DEFAULT_MODELS[c.type]];
    save();openApiModal();return}
  else c[k]=el.value.trim();
  save();render()}
$('#ps').oninput=e=>{if(e.target.tagName!=='SELECT')syncField(e.target)};
$('#ps').onchange=e=>syncField(e.target);
$('#ps').onclick=async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a==='add'){channels.push({id:uid(),name:'新接口',type:'openai',base:BASE.openai,key:'',models:[]});save();openApiModal();return}
  const c=channels.find(x=>x.id===b.closest('.card').dataset.id);if(!c)return;
  if(a==='del'){if(!confirm('删除「'+c.name+'」？'))return;channels=channels.filter(x=>x!==c);if(sel?.ch===c.id)sel=null;save();openApiModal();return}
  if(a==='fetch'){
    if(!c.key&&c.type!=='openai'){toast('先填 API Key');return}
    if(b.disabled)return;
    b.disabled=true;b.textContent='获取中…';
    try{const ms=await listModels(c);if(!channels.includes(c))return;c.models=ms;if(sel?.ch===c.id&&!c.models.includes(sel.m))sel=null;save();toast('获取到 '+ms.length+' 个模型');const t=document.querySelector('.card[data-id="'+c.id+'"] [data-k=models]');if(t)t.value=ms.join('\n');render()}catch(err){toast(err.message.slice(0,80))}
    b.disabled=false;b.textContent='获取模型列表'}};

render();if(!channels.length)setTimeout(()=>{if(!channels.length){channels.push({id:uid(),name:'我的接口',type:'openai',base:BASE.openai,key:'',models:[]});save();openApiModal()}},300);
</script>
</body>
</html>
